<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Simulated Grad-CAM visualization</title>
  <desc id="desc">Illustrative heatmap overlay representing a model attention visualization, not a real analysis.</desc>
  <defs>
    <linearGradient id="base" x2="0" y2="1"><stop stop-color="#f0d4c6"/><stop offset="1" stop-color="#dcb09c"/></linearGradient>
    <radialGradient id="heat"><stop stop-color="#ef4444" stop-opacity=".78"/><stop offset=".43" stop-color="#f97316" stop-opacity=".52"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></radialGradient>
    <radialGradient id="lesion"><stop stop-color="#624139"/><stop offset=".68" stop-color="#8e5c4b"/><stop offset="1" stop-color="#a87866" stop-opacity=".3"/></radialGradient>
  </defs>
  <rect width="800" height="520" rx="24" fill="url(#base)"/>
  <ellipse cx="420" cy="255" rx="94" ry="76" fill="url(#lesion)"/>
  <ellipse cx="420" cy="255" rx="210" ry="172" fill="url(#heat)"/>
  <ellipse cx="420" cy="255" rx="128" ry="105" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 9" opacity=".8"/>
  <rect x="28" y="28" width="744" height="464" rx="18" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
  <rect x="28" y="438" width="744" height="54" fill="#172033" fill-opacity=".72"/>
  <text x="52" y="472" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="600">SIMULATED HEATMAP · NOT A MODEL OUTPUT</text>
</svg>
